name: Build Wasm
description: Install the verified wasm-pack release and build the solver.
runs:
  using: composite
  steps:
    - name: Install wasm-pack
      shell: bash
      run: |
        release=wasm-pack-v0.13.1-x86_64-unknown-linux-musl
        archive="$RUNNER_TEMP/$release.tar.gz"
        curl --fail --silent --show-error --location \
          "https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.13.1/$release.tar.gz" \
          --output "$archive"
        echo "c539d91ccab2591a7e975bcf82c82e1911b03335c80aa83d67ad25ed2ad06539  $archive" | sha256sum --check
        tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" "$release/wasm-pack"
        echo "$RUNNER_TEMP/$release" >> "$GITHUB_PATH"
    - name: Compile Wasm and generate TypeScript declarations
      shell: bash
      run: wasm-pack build --target web --out-dir ../public/wasm -- --locked
      working-directory: ./wasm
